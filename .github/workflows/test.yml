name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  catalog-integrity:
    name: marketplace and skill integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: pip install --quiet pytest

      - name: Verify lock file
        run: python scripts/build_skill_lock.py --check

      # The lock is derived from marketplace.json, so it cannot see a skill that
      # was added to disk and never registered — that skill just silently ships
      # to no one. This catches it, plus missing policies, descriptors, and
      # README rows.
      - name: Validate catalog consistency
        run: python scripts/validate_catalog.py

      - name: Test lock builder
        working-directory: scripts
        run: pytest test_build_skill_lock.py -q

      - name: Test catalog validator
        working-directory: scripts
        run: pytest test_validate_catalog.py -q

  point-in-time-research:
    name: point-in-time-research harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/point-in-time-research/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy pytest

      - name: Smoke — the bundled harness runs and emits no warnings
        run: |
          python -W error::RuntimeWarning information_set_compare.py --demo > /dev/null

      - name: Regression tests
        run: pytest test_information_set_compare.py -q

